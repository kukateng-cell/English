name: Deploy english-seeword

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-english-seeword
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy demo site
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_TEUByW1O0T2ztBXSHJ5a5Kag
      VERCEL_PROJECT_ID: prj_0wp8aRY5l83xzr72RqNFBHat3ChY
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_SEEWORD }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN_SEEWORD is not configured; skipping demo deployment."
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
