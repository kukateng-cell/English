name: Study quality gate

on:
  push:
    paths:
      - ".github/workflows/card-motion.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "src/app/study/page.tsx"
      - "src/app/(student)/study/**"
      - "src/app/api/study/**"
      - "src/app/api/auth/**"
      - "src/app/login/**"
      - "src/components/WordCard.tsx"
      - "src/components/study-stream/**"
      - "src/app/test/word-card-motion/**"
      - "src/lib/auth.ts"
      - "src/lib/login-limiter.ts"
      - "src/lib/checkpoint.ts"
      - "src/lib/review-queue.ts"
      - "src/lib/session.ts"
      - "src/lib/study-*.ts"
      - "src/lib/learning-policy/**"
      - "src/lib/study-stream/**"
      - "src/lib/production-config.ts"
      - "src/lib/production-config.test.ts"
      - "src/lib/student-metrics.ts"
      - "src/lib/leaderboard.ts"
      - "src/lib/achievements.ts"
      - "src/lib/swipe-motion.ts"
      - "prisma/schema.prisma"
      - "prisma/seed.ts"
      - "prisma/migrations/**"
      - "prisma/contract-migrations/**"
      - "scripts/**"
      - "src/proxy.ts"
      - "tests/e2e/auth.setup.ts"
      - "tests/e2e/study-workflow.spec.ts"
      - "tests/e2e/word-card-release.spec.ts"
      - "tests/e2e/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: study-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm run audit:production

  study-quality:
    name: Unit, database, migration, and browser regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      MIGRATE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://127.0.0.1:3100
      INITIAL_ADMIN_PASSWORD: CiAdminPlaceholder!2026
      DATABASE_ENVIRONMENT: test
      CONFIRM_DATABASE_ENVIRONMENT: test
      SEED_TEST_STUDENT: "1"
      TEST_STUDENT_USERNAME: __test_student__ci_card_motion
      TEST_STUDENT_PASSWORD: CiCardMotion!2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        run: npm test

      - name: Run ESLint with zero warnings
        run: npm run lint -- --max-warnings=0

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Verify migration checksums
        run: npm run test:migration-checksums

      - name: Replay migrations on a fresh schema
        run: npm run test:migrations

      - name: Verify expand, confirmed contract, and future ordinary deploy
        run: npm run test:migrations:contract

      - name: Deploy migrations to the CI database
        run: npm run db:deploy

      - name: Run review ledger and concurrency checks
        run: npm run test:db

      - name: Seed the card-motion test account and words
        run: npm run seed

      - name: Run V2 stream integration and bounded soak
        run: |
          npm run test:db:stream-v2
          STUDY_STREAM_SOAK_ITERATIONS=3 npm run check:study-stream-v2:soak

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify cross-browser emulated card release motion
        run: npm run test:e2e:card-motion

      - name: Verify student IA regression
        run: npm run test:e2e:student-ia

      - name: Verify student accessibility and fidelity regression
        run: npm run test:e2e:student-qa

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: card-motion-playwright-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
