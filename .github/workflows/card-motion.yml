name: Card motion browser regression

on:
  push:
    paths:
      - ".github/workflows/card-motion.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "src/app/study/page.tsx"
      - "src/components/WordCard.tsx"
      - "src/lib/swipe-motion.ts"
      - "tests/e2e/word-card-release.spec.ts"
  pull_request:
    paths:
      - ".github/workflows/card-motion.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "src/app/study/page.tsx"
      - "src/components/WordCard.tsx"
      - "src/lib/swipe-motion.ts"
      - "tests/e2e/word-card-release.spec.ts"

permissions:
  contents: read

concurrency:
  group: card-motion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    name: Mouse and touch release continuity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      MIGRATE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://127.0.0.1:3100
      INITIAL_ADMIN_PASSWORD: CiAdminPlaceholder!2026
      SEED_TEST_STUDENT: "1"
      TEST_STUDENT_USERNAME: __test_student__ci_card_motion
      TEST_STUDENT_PASSWORD: CiCardMotion!2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy migrations to the CI database
        run: npm run db:deploy

      - name: Seed the card-motion test account and words
        run: npm run seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify cross-browser card release motion
        run: npm run test:e2e:card-motion
