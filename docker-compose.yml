# 本地开发用的 PostgreSQL。
# 项目 schema 已统一为 Postgres（prisma/schema.prisma），不再支持 SQLite。
#
# 用法：
#   docker compose up -d        # 启动（后台）
#   docker compose logs -f db   # 看日志
#   docker compose down         # 停止（保留数据卷）
#   docker compose down -v      # 停止并删除数据（重置数据库）
#
# 启动后把 .env.example 里的 DATABASE_URL / MIGRATE_URL 复制到 .env.local 即可。
services:
  db:
    image: postgres:16-alpine
    container_name: english-db
    restart: unless-stopped
    # 与 .env.example 里的连接串保持一致：
    #   postgresql://english:english_dev_password@localhost:5432/english
    environment:
      POSTGRES_USER: english
      POSTGRES_PASSWORD: english_dev_password
      POSTGRES_DB: english
    ports:
      - "5432:5432"
    volumes:
      - english_pgdata:/var/lib/postgresql/data
    # healthcheck 让 `docker compose up --wait` / CI 能等到库就绪后再跑 migrate。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english -d english"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  english_pgdata:
